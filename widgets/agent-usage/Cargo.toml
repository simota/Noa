[package]
name = "agent-usage"
description = "Agent usage widget for Noa: rate limits and local-log statistics for Claude Code, Codex and Antigravity, built with noa-gpui"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "agent_usage"
path = "src/lib.rs"

[[bin]]
name = "agent-usage"
path = "src/main.rs"

[dependencies]
noa-gpui-platform = { version = "0.2.1", features = ["native"] }
noa-gpui-core = "0.2.1"
noa-gpui-scene = "0.2.1"
noa-gpui-text = "0.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSLocale"] }

[dev-dependencies]
tempfile = "3"
