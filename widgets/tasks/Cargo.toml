[package]
name = "tasks"
description = "Tasks widget for Noa: local tasks and the repository's GitHub issues on one list, each handed to a coding agent in a Noa float and followed from to-do through running and review to done by what Noa reports, built with noa-gpui and noa-ipc"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
noa-gpui-platform = { version = "0.2.1", features = ["native"] }
noa-gpui-core = "0.2.1"
noa-gpui-scene = "0.2.1"
noa-gpui-text = "0.2.1"
noa-ipc = { path = "../../crates/noa-ipc" }
noa-config = { path = "../../crates/noa-config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.24"
# openat/mkdirat for link-safe creation (fsx); already in the lock (0.2.191).
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSLocale"] }
