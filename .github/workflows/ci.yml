name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # One target directory for the workspace and every widget crate. The
  # widgets live outside the workspace, each with a target/ of its own, so
  # without this each one compiles the same noa-gpui stack from scratch; with
  # it, Cargo reuses what an earlier build left (artifacts are keyed by
  # version and features, so differing lockfiles still build apart).
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  # Every CI build starts from a fresh checkout, so incremental state is never
  # reused: it only costs time to write (local cold run 469s -> 423s, target
  # 23G -> 17G). Line tables keep file:line in backtraces but drop the rest of
  # the debug info (423s -> 370s, 17G -> 8.1G). Neither changes what the tests
  # check: debug assertions and overflow checks stay on.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust 1.92.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.92.0 \
            --profile minimal \
            --component rustfmt \
            --no-self-update
          rustup default 1.92.0

      # Restore the build of the registry dependencies, which a fresh checkout
      # otherwise compiles from scratch. Noa's own crates rebuild every run
      # (their sources are newer than any cached artifact), so the key only
      # follows what decides the dependencies: the toolchain, the lockfiles
      # and the manifests (the widgets set per-package profiles there).
      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-1.92.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'widgets/*/Cargo.lock', 'widgets/*/Cargo.toml') }}
          restore-keys: cargo-v1-${{ runner.os }}-${{ runner.arch }}-1.92.0-

      # The checks live in scripts/verify.sh; CI lists none of its own.
      - name: Verify
        run: scripts/verify.sh --full

      # Only main saves, so pull requests restore main's cache and never
      # evict it from the repository's 10 GB quota with their own.
      - name: Trim build cache
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/noa-ci-performance-k7rqu9') && steps.cache.outputs.cache-hit != 'true'
        run: scripts/ci-trim-target.sh

      - name: Save build cache
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/noa-ci-performance-k7rqu9') && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: TEMP print verify summary
        if: always()
        shell: bash
        run: grep -H -E "Finished|Running|test result" .verify/*.log | sed 's/\x1b\[[0-9;]*m//g' || true

      - name: Keep verify output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-output-macos
          include-hidden-files: true
          path: .verify/

  build-and-test-linux:
    name: Build and test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libwayland-dev \
            fonts-dejavu-core desktop-file-utils appstream

      - name: Install Rust 1.92.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.92.0 \
            --profile minimal \
            --component clippy \
            --component rustfmt \
            --no-self-update
          rustup default 1.92.0

      # Restore the build of the registry dependencies, which a fresh checkout
      # otherwise compiles from scratch. Noa's own crates rebuild every run
      # (their sources are newer than any cached artifact), so the key only
      # follows what decides the dependencies: the toolchain, the lockfiles
      # and the manifests (the widgets set per-package profiles there).
      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-1.92.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'widgets/*/Cargo.lock', 'widgets/*/Cargo.toml') }}
          restore-keys: cargo-v1-${{ runner.os }}-${{ runner.arch }}-1.92.0-

      - name: Verify
        run: scripts/verify.sh --full

      # Only main saves, so pull requests restore main's cache and never
      # evict it from the repository's 10 GB quota with their own.
      - name: Trim build cache
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/noa-ci-performance-k7rqu9') && steps.cache.outputs.cache-hit != 'true'
        run: scripts/ci-trim-target.sh

      - name: Save build cache
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/noa-ci-performance-k7rqu9') && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: TEMP print verify summary
        if: always()
        shell: bash
        run: grep -H -E "Finished|Running|test result" .verify/*.log | sed 's/\x1b\[[0-9;]*m//g' || true

      - name: Keep verify output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-output-linux
          include-hidden-files: true
          path: .verify/
