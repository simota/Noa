[package]
name = "agent-dashboard-mock"
description = "Screen mock of an agent operations dashboard for Noa, drawn with noa-gpui on live data from Noa or canned demo data"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
noa-gpui-platform = { version = "0.2.0", features = ["native"] }
noa-gpui-core = "0.2.0"
noa-gpui-scene = "0.2.0"
noa-gpui-text = "0.2.0"
noa-ipc = { path = "../../crates/noa-ipc" }
noa-config = { path = "../../crates/noa-config" }
serde_json = "1"
