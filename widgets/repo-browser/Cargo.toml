[package]
name = "repo-browser"
description = "Cross-worktree repository browser and live diff review for Noa, built with noa-gpui and noa-ipc"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
noa-gpui-platform = { version = "0.2.1", features = ["native"] }
noa-gpui-core = "0.2.1"
noa-gpui-scene = "0.2.1"
noa-gpui-text = "0.2.1"
noa-ipc = { path = "../../crates/noa-ipc" }
noa-config = { path = "../../crates/noa-config" }
serde_json = "1"
