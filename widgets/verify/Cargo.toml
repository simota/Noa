[package]
name = "verify"
description = "Multi-agent verification for Noa: verifiers on different strategies check a change against agreed acceptance criteria, each in its own worktree, reproduce or refute each other's results, and a judge rules on every criterion from recorded, hashed evidence, built with noa-gpui and noa-ipc"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
noa-gpui-platform = { version = "0.2.1", features = ["native"] }
noa-gpui-core = "0.2.1"
noa-gpui-scene = "0.2.1"
noa-gpui-text = "0.2.1"
noa-ipc = { path = "../../crates/noa-ipc" }
noa-config = { path = "../../crates/noa-config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.24"
# openat/mkdirat for link-safe creation (fsx); already in the lock (0.2.191).
libc = "0.2"
# The same bounded image decoders as widget-host; evidence paths are verified first.
png = "0.18"
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
image-webp = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSLocale"] }

# The tests lay out and shape text through cosmic-text. Unoptimized, its font
# parsing and shaping dominate them (the tasks widget's tests: 88s at
# opt-level 0, 25s with these four at 1). Only these crates are optimized, so
# a cold build costs ~25s more rather than ~3x; debug assertions and overflow
# checks stay on.
[profile.dev.package.font-types]
opt-level = 1
[profile.dev.package.read-fonts]
opt-level = 1
[profile.dev.package.skrifa]
opt-level = 1
[profile.dev.package.harfrust]
opt-level = 1
