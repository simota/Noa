[package]
name = "competition"
description = "Blind multi-agent competition for Noa: contestants compete independently on one request, reveal peer work every N rounds, and compare artifacts side by side, built with noa-gpui and noa-ipc"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
noa-gpui-platform = { version = "0.2.1", features = ["native"] }
noa-gpui-core = "0.2.1"
noa-gpui-scene = "0.2.1"
noa-gpui-text = "0.2.1"
noa-ipc = { path = "../../crates/noa-ipc" }
noa-config = { path = "../../crates/noa-config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSLocale"] }
