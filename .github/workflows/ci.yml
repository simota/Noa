name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust 1.92.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.92.0 \
            --profile minimal \
            --component rustfmt \
            --no-self-update
          rustup default 1.92.0

      # The checks live in scripts/verify.sh; CI lists none of its own.      - name: Verify
        run: scripts/verify.sh --full

      - name: Keep verify output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-output-macos
          include-hidden-files: true
          path: .verify/

  build-and-test-linux:
    name: Build and test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libwayland-dev \
            fonts-dejavu-core desktop-file-utils appstream

      - name: Install Rust 1.92.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.92.0 \
            --profile minimal \
            --component clippy \
            --component rustfmt \
            --no-self-update
          rustup default 1.92.0

      - name: Verify
        run: scripts/verify.sh --full

      - name: Keep verify output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-output-linux
          include-hidden-files: true
          path: .verify/
