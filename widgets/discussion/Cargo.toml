[package]
name = "discussion"
description = "Moderated multi-agent discussion for Noa: a moderator agent relays a topic to panelist agents and summarizes each round, built with noa-gpui and noa-ipc"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
noa-gpui-platform = { version = "0.2.1", features = ["native"] }
noa-gpui-core = "0.2.1"
noa-gpui-scene = "0.2.1"
noa-gpui-text = "0.2.1"
noa-ipc = { path = "../../crates/noa-ipc" }
noa-config = { path = "../../crates/noa-config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
